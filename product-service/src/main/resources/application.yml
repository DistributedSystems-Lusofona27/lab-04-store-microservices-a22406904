spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:product_db}
    username: ${POSTGRES_USER:product}
    password: ${POSTGRES_PASSWORD:product}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

server:
  port: 8081

# Custom properties are TOP LEVEL, not nested under `spring:`.
# Nesting them is why last year's Lab 7 would not start.
# The key is `clients`, which is what the lab pages read.
clients:
  supplier:
    base-url: ${SUPPLIER_SERVICE_URL:http://localhost:8082}
